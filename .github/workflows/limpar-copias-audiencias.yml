name: Limpar cópias integrais de audiências

on:
  schedule:
    - cron: '10 4 * * 1'  # segunda 00:10 Manaus = 04:10 UTC (Manaus é UTC-4, sem horário de verão)
  workflow_dispatch:  # Permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read

concurrency:
  group: limpar-copias-audiencias
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Apagar cópias de semanas que já passaram
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python limpar-copias-audiencias.py
